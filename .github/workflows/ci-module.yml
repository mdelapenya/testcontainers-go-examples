name: Run tests for the Go module
run-name: "${{ inputs.project-directory }}"

on:
  workflow_call:
    inputs:
      project-directory:
        required: true
        type: string
        default: "."
        description: "The directory where the Go project is located."

permissions:
  contents: read

jobs:
  test-go-project:
    name: "${{ inputs.project-directory }} / ${{ matrix.os }}"
    strategy:
      matrix:
        os: ['ubuntu-latest', 'macos-latest', 'windows-latest']
    runs-on: ${{ matrix.os }} 
    continue-on-error: true
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4

      - name: Set up Go
        uses: actions/setup-go@0c52d547c9bc32b1aa3301fd7a9cb496313a4491 # v5
        with:
            go-version-file: ${{ inputs.project-directory }}/go.mod
            cache-dependency-path: '${{ inputs.project-directory }}/go.sum'
        id: go

      - name: modVerify
        working-directory: ${{ inputs.project-directory }}
        run: go mod verify

      - name: modTidy
        working-directory: ${{ inputs.project-directory }}
        run: go mod tidy

      - name: Run Tests
        working-directory: ${{ inputs.project-directory }}
        run: go test -v ./... -count=1 -timeout=300s
