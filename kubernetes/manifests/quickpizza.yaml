# Official QuickPizza Kubernetes Manifest
# Based on: https://github.com/grafana/quickpizza/tree/main/deployments/kubernetes/base/quickpizza
# Image version: 0.15.21

# ============================================================================
# Database
# ============================================================================
---
apiVersion: v1
kind: Secret
metadata:
  name: quickpizza-db-credentials
type: Opaque
stringData:
  DATABASE_PASSWORD: quickpizza
  CONNECTION_STRING: postgres://quickpizza:quickpizza@quickpizza-db/quickpizza?sslmode=disable

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: quickpizza-db
  labels:
    environment: production
    app.k8s.io/name: quickpizza-app
    app.kubernetes.io/component: database
    app.kubernetes.io/instance: quickpizza-db
spec:
  replicas: 1
  serviceName: quickpizza-db
  selector:
    matchLabels:
      environment: production
      app.k8s.io/name: quickpizza-app
      app.kubernetes.io/component: database
      app.kubernetes.io/instance: quickpizza-db
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
  template:
    metadata:
      labels:
        environment: production
        app.k8s.io/name: quickpizza-app
        app.kubernetes.io/component: database
        app.kubernetes.io/instance: quickpizza-db
    spec:
      containers:
        - name: postgres
          image: postgres:18
          ports:
            - containerPort: 5432
              name: psql
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: quickpizza-db-credentials
                  key: DATABASE_PASSWORD
            - name: POSTGRES_DB
              value: quickpizza
            - name: POSTGRES_USER
              value: quickpizza
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql

---
apiVersion: v1
kind: Service
metadata:
  name: quickpizza-db
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: psql
  selector:
    environment: production
    app.k8s.io/name: quickpizza-app
    app.kubernetes.io/component: database
    app.kubernetes.io/instance: quickpizza-db

# ============================================================================
# ConfigMap
# ============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: quickpizza-env-common
data:
  QUICKPIZZA_TRUST_CLIENT_TRACEID: "true"
  QUICKPIZZA_ENABLE_ALL_SERVICES: "0"
  QUICKPIZZA_CATALOG_ENDPOINT: http://quickpizza-catalog:3333
  QUICKPIZZA_COPY_ENDPOINT: http://quickpizza-copy:3333
  QUICKPIZZA_WS_ENDPOINT: http://quickpizza-ws:3333
  QUICKPIZZA_RECOMMENDATIONS_ENDPOINT: http://quickpizza-recommendations:3333
  QUICKPIZZA_CONFIG_ENDPOINT: http://quickpizza-config:3333
  QUICKPIZZA_OTEL_DB_NAME: quickpizza-db

# ============================================================================
# Public API Service (Frontend Gateway)
# ============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quickpizza-public-api
  labels:
    app.k8s.io/name: quickpizza
    app.kubernetes.io/component: service
    app.kubernetes.io/instance: public-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.k8s.io/name: quickpizza
      app.kubernetes.io/instance: public-api
  template:
    metadata:
      labels:
        app.k8s.io/name: quickpizza
        app.kubernetes.io/instance: public-api
    spec:
      containers:
        - name: quickpizza
          image: ghcr.io/grafana/quickpizza-local:0.15.21
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3333
          envFrom:
            - configMapRef:
                name: quickpizza-env-common
          env:
            - name: QUICKPIZZA_ENABLE_PUBLIC_API_SERVICE
              value: "1"
            - name: QUICKPIZZA_OTEL_SERVICE_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: QUICKPIZZA_OTEL_SERVICE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/instance']
            - name: QUICKPIZZA_DB
              valueFrom:
                secretKeyRef:
                  name: quickpizza-db-credentials
                  key: CONNECTION_STRING
          readinessProbe:
            httpGet:
              path: /ready
              port: 3333
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3333
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: quickpizza-public-api
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/instance: public-api
  ports:
    - protocol: TCP
      port: 3333
      targetPort: 3333

