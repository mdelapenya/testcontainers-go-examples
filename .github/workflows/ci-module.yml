name: Run tests for the Go module
run-name: "${{ inputs.project-directory }}"

on:
  workflow_call:
    inputs:
      project-directory:
        required: true
        type: string
        default: "."
        description: "The directory where the Go project is located."

permissions:
  contents: read

jobs:
  test-go-project:
    name: "${{ inputs.project-directory }} / ${{ matrix.testcontainers-go-version }} / ${{ matrix.os }}"
    strategy:
      matrix:
        os: ['ubuntu-latest']
        testcontainers-go-version: ["v0.39.0", "main"]
    runs-on: ${{ matrix.os }} 
    continue-on-error: true
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
            go-version-file: ${{ inputs.project-directory }}/go.mod
            cache-dependency-path: '${{ inputs.project-directory }}/go.sum'
        id: go

      - name: Use testcontainers-go@${{ matrix.testcontainers-go-version }}
        if: ${{ inputs.project-directory == 'compose-module' }}
        working-directory: ${{ inputs.project-directory }}
        run: go get github.com/testcontainers/testcontainers-go/modules/compose@${{ matrix.testcontainers-go-version }}

      - name: Use testcontainers-go@${{ matrix.testcontainers-go-version }}
        working-directory: ${{ inputs.project-directory }}
        run: go get github.com/testcontainers/testcontainers-go@${{ matrix.testcontainers-go-version }}

      - name: modVerify
        working-directory: ${{ inputs.project-directory }}
        run: go mod verify

      - name: modTidy
        working-directory: ${{ inputs.project-directory }}
        run: go mod tidy

      - name: warm up Docker images for Compose
        if: ${{ inputs.project-directory == 'compose-module' }}
        working-directory: ${{ inputs.project-directory }}
        run: docker compose -f testdata/docker-compose.yml pull

      - name: Run Tests
        timeout-minutes: 30
        working-directory: ${{ inputs.project-directory }}
        env:
          # defines the timeout for Ryuk to receive the first connection (default: 60s). Value layout is described in time.ParseDuration documentation.
          RYUK_CONNECTION_TIMEOUT: '120s'
          # defines the timeout for Ryuk to reconnect to Docker (default: 10s). Value layout is described in time.ParseDuration documentation.
          RYUK_RECONNECTION_TIMEOUT: '30s'
          TESTCONTAINERS_RYUK_DISABLED: false
          TESTCONTAINERS_RYUK_CONTAINER_PRIVILEGED: true
        run: go test -v ./... -count=1 -timeout=300s
